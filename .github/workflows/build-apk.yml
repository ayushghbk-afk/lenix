name: Build Lenix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Without this the APK ships with an empty lib/arm64-v8a/ and the app dies at
      # START with NATIVE_ENGINE_FAILED ("No PRoot engine for 'arm64-v8a' was found").
      # The payload is not committed (GPL binaries, ~1 MB), so CI has to fetch it.
      - name: Fetch PRoot engine payload
        run: ./scripts/fetch-engine.sh arm64-v8a

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lenix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
