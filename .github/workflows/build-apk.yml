name: Build Lenix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee gradle-test.log
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo "## Unit test step failed"
              echo ""
              echo "### JUnit failures (from test-results XML)"
              echo '```'
              python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          shown = 0
          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  shown += 1
                  print(f"FAILED: {case.get('classname')}.{case.get('name')}")
                  message = (failure.get("message") or "").strip()
                  if message:
                      print(f"  message: {message[:600]}")
                  for line in (failure.text or "").strip().splitlines()[:25]:
                      print(f"  {line}")
                  print()
          if shown == 0:
              print("(no failing testcase found in JUnit XML - likely a compile error)")
          PYEOF
              echo '```'
              echo ""
              echo "### Gradle log tail"
              echo '```'
              tail -n 120 gradle-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lenix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
